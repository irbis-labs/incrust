name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: incrust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy (no Cargo.lock)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
      - name: Fail if Cargo.lock is committed
        run: |
          set -euo pipefail
          if git ls-files | grep -Eq '(^|/)Cargo\.lock$'; then
            echo "error: Cargo.lock must not be committed in library repositories (it should be gitignored)." >&2
            exit 1
          fi

  fmt:
    name: fmt
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: cargo fmt (check)
        run: cargo +nightly fmt --all -- --check

  test:
    name: check / test / clippy
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace --all-features
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: msrv (rustc 1.85.0)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: cargo test (stable cargo + MSRV rustc)
        run: |
          set -euo pipefail
          SYSROOT="$(rustc +1.85.0 --print sysroot)"
          RUSTC="$SYSROOT/bin/rustc" \
          RUSTDOC="$SYSROOT/bin/rustdoc" \
          cargo +stable test --workspace --all-features
